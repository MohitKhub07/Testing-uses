<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Food Menu</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>🍔 Royal Food Corner</h1>
  <p>Delicious Food At Best Price</p>
</header>

<section class="menu">

  <div class="card">
    <img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?q=80&w=800" alt="Burger">
    <h2>Burger</h2>
    <p>Cheesy Veg Burger</p>
    <span>₹120</span>
  </div>

  <div class="card">
    <img src="https://images.unsplash.com/photo-1513104890138-7c749659a591?q=80&w=800" alt="Pizza">
    <h2>Pizza</h2>
    <p>Farm Fresh Pizza</p>
    <span>₹250</span>
  </div>

  <div class="card">
    <img src="https://www.thespruceeats.com/steamed-momos-wontons-1957616" alt="Momos">
    <h2>Momos</h2>
    <p>Steam Momos</p>
    <span>₹90</span>
  </div>

</section>

<section class="qr-section">
  <h2>📱 Scan QR For Menu</h2>

  <img
    <img src="https://raw.githubusercontent.com/MohitKhub07/Testing-uses/refs/heads/main/QR.png" alt="QR">
  >
</section>

<footer>
  <p>© 2026 Royal Food Corner</p>
</footer>

<script src="script.js"></script>

</body>
</html>
